services:
  app:
    build: .
    container_name: cbe_ai_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://cbe:cbe@postgres:5432/cbe_ai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app

  postgres:
    image: postgres:16-alpine
    container_name: cbe_ai_pg
    environment:
      POSTGRES_USER: cbe
      POSTGRES_PASSWORD: cbe
      POSTGRES_DB: cbe_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cbe_ai_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
