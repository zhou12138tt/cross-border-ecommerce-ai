[project]
name = "cross-border-ecommerce-ai"
version = "0.1.0"
description = "AI-driven cross-border e-commerce operations platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.2",
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
]
redis = [
    "redis>=5.0.0",
    "celery>=5.3.0",
]
llm = [
    "openai>=1.12.0",
    "langchain>=0.1.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
